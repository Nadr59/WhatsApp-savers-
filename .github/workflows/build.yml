name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties

      - name: Verify Android SDK exists
        run: |
          ls -la /usr/local/lib/android/sdk/platforms/ || echo "No platforms"
          ls -la /usr/local/lib/android/sdk/build-tools/ || echo "No build-tools"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug
        run: |
          cat settings.gradle
          ./gradlew projects --no-daemon || true
          ./gradlew :app:tasks --no-daemon 2>&1 | grep -i assemble || echo "No assemble tasks"

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Saver-debug
          path: app/build/outputs/**/*.apk
          retention-days: 30
