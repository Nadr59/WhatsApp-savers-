name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Debug - Show everything
        run: |
          echo "=== ANDROID_HOME ==="
          echo $ANDROID_HOME
          echo "=== ANDROID_SDK_ROOT ==="
          echo $ANDROID_SDK_ROOT
          echo "=== SDK contents ==="
          ls $ANDROID_HOME/platforms/ || true
          echo "=== settings.gradle ==="
          cat settings.gradle
          echo "=== app/build.gradle head ==="
          head -5 app/build.gradle
          echo "=== Projects ==="
          ./gradlew projects --no-daemon 2>&1 || true
          echo "=== Tasks with assemble ==="
          ./gradlew tasks --all --no-daemon 2>&1 | grep -i assemble || true

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "Building with ANDROID_HOME=$ANDROID_HOME"
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 || {
            echo "=== assembleDebug failed, trying :app:assembleDebug ==="
            ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1
          }

      - name: Find APK files
        if: always()
        run: |
          echo "=== Looking for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WhatsApp-Saver-debug
          path: app/build/outputs/**/*.apk
          retention-days: 30
